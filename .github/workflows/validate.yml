name: Validate release metadata and reports
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-release-metadata.cjs --check
      - run: node --test tests/webmcp.test.cjs
