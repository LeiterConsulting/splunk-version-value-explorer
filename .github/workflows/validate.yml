name: Validate release metadata and reports
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-release-metadata.cjs --check
      - run: node scripts/sync-source-register.cjs --check
      - run: node scripts/sync-content-revision.cjs --check
      - run: node scripts/sync-content.cjs --check
      - run: node --test tests/*.test.cjs
      - run: node scripts/build-worker.cjs
      - run: npm ci --prefix tools/export-verification
      - run: tools/export-verification/node_modules/.bin/playwright install --with-deps chromium
      - name: Install PDF page renderer
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: node tools/export-verification/verify.mjs
      - name: Bind rendered exports to release readiness
        run: |
          node -e 'const fs=require("node:fs");const input=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));input.evaluatedAt=new Date().toISOString();fs.writeFileSync(process.argv[2],JSON.stringify(input,null,2)+"\n")' docs/audits/2026-10-10-version-release-watch-soak.json /tmp/version-release-watch-soak.json
          node scripts/check-soak.cjs /tmp/version-release-watch-soak.json --exports export-artifacts
      - name: Retain candidate export evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-evidence-${{ github.sha }}
          path: export-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Retain affected Cloud images for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-visual-review-${{ github.sha }}
          path: |
            export-artifacts/evidence.json
            export-artifacts/cloud-default/desktop.png
            export-artifacts/cloud-default/narrow.png
            export-artifacts/cloud-default/page-*.png
            export-artifacts/cloud-default/inspection.json
            export-artifacts/cloud-default/content.txt
            export-artifacts/cloud-cisco/desktop.png
            export-artifacts/cloud-cisco/narrow.png
            export-artifacts/cloud-cisco/page-*.png
            export-artifacts/cloud-cisco/inspection.json
            export-artifacts/cloud-cisco/content.txt
          if-no-files-found: error
          retention-days: 30
