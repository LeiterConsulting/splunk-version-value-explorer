name: Publish verified content
on:
  workflow_run:
    workflows: [Validate release metadata and reports]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  id-token: write
concurrency:
  group: versioncompass-content-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select the validated candidate without broadening OIDC scope
        id: candidate
        run: node scripts/select-publication.cjs
      - name: Publish exact main commit with GitHub OIDC
        if: steps.candidate.outputs.publish == 'true'
        env:
          VC_GITHUB_EVIDENCE_TOKEN: ${{ github.token }}
        # The service independently verifies main ancestry, completed validation CI,
        # all required steps and exact committed artifacts before writing anything.
        run: node scripts/publish-content.mjs --commit "${{ steps.candidate.outputs.commit }}"
      - name: Retain truthful publisher outcome
        if: always() && hashFiles('publication-outcome.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: publisher-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-outcome.json
          if-no-files-found: error
          retention-days: 30
