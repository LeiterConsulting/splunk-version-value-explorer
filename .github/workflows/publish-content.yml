name: Publish verified content
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'observe-only' && 'Observe bundled seed' || github.event_name == 'workflow_dispatch' && inputs.mode == 'head-only' && 'Observe publisher head' || github.event_name == 'workflow_dispatch' && inputs.mode == 'bootstrap-only' && 'Bootstrap reviewed seed (D1 write)' || github.event_name == 'workflow_dispatch' && inputs.mode == 'resume-only' && 'Prepare bundled seed batch (D1 write)' || 'Publish verified content' }}
on:
  workflow_run:
    workflows: [Validate release metadata and reports]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Publish held; observations are read-only; bootstrap-only writes reviewed seed/history to D1 without activation; resume-only writes one seed batch without head/history
        type: choice
        options: [publish, observe-only, head-only, bootstrap-only, resume-only]
        default: publish
        required: true
      expected_commit:
        description: Observation, bootstrap and resume modes require the exact main commit SHA
        type: string
      expected_ref:
        description: Observation, bootstrap and resume modes must use refs/heads/main
        type: string
        default: refs/heads/main
      expected_engine:
        description: Observation, bootstrap and resume modes require the engine revision from the reviewed deployed-seed record
        type: string
      expected_revision:
        description: Observation, bootstrap and resume modes require the bundled revision from the reviewed deployed-seed record
        type: string
      expected_seed_commit:
        description: Observation, bootstrap and resume modes require the reviewed deployed seed GitHub source commit
        type: string
permissions:
  actions: read
  contents: read
  id-token: write
concurrency:
  group: versioncompass-content-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      # This policy executes from the workflow itself, before any repository script.
      # A delayed validation of an older commit cannot check out an older writer.
      - name: Hold publication before checkout or credentials
        if: github.event_name != 'workflow_dispatch' || (inputs.mode != 'observe-only' && inputs.mode != 'head-only' && inputs.mode != 'bootstrap-only' && inputs.mode != 'resume-only')
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const receipt = { commit: /^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA || '') ? process.env.GITHUB_SHA : null,
            recordedAt: new Date().toISOString(), status: 'held-publication-disabled', action: 'pre-write-hold', target: 'local-policy',
            completedActions: [], requests: 0, credentialAcquired: false, mutationAttempted: false, mutationOutcome: 'not-attempted', claimedDelivered: false,
            qualification: 'Publication held before checkout, candidate selection, credentials and production requests. Runtime and publisher state remain unobserved.' };
          fs.writeFileSync('publication-outcome.json', JSON.stringify(receipt, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\nPublisher outcome: **held-publication-disabled**\n\n' + receipt.qualification + '\n');
          console.log(JSON.stringify(receipt));
          process.exitCode = 1;
          NODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Route publisher mode before any candidate selection
        id: mode
        run: node scripts/publisher-workflow-mode.cjs
      - name: Prepare one exact bundled seed batch without publication
        if: steps.mode.outputs.mode == 'resume-only'
        env:
          VC_RESUME_MODE: ${{ inputs.mode }}
          VC_RESUME_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          VC_RESUME_EXPECTED_REF: ${{ inputs.expected_ref }}
          VC_RESUME_EXPECTED_SEED_COMMIT: ${{ inputs.expected_seed_commit }}
          VC_RESUME_EXPECTED_ENGINE: ${{ inputs.expected_engine }}
          VC_RESUME_EXPECTED_REVISION: ${{ inputs.expected_revision }}
          VC_GITHUB_EVIDENCE_TOKEN: ${{ github.token }}
        run: node scripts/resume-seed.mjs
      - name: Retain sanitized seed preparation outcome including failures
        if: always() && steps.mode.outputs.mode == 'resume-only' && hashFiles('resume-seed-outcome.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: resume-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: resume-seed-outcome.json
          if-no-files-found: error
          retention-days: 30
      - name: Bootstrap exact reviewed seed without activation
        if: steps.mode.outputs.mode == 'bootstrap-only'
        env:
          VC_BOOTSTRAP_MODE: ${{ inputs.mode }}
          VC_BOOTSTRAP_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          VC_BOOTSTRAP_EXPECTED_REF: ${{ inputs.expected_ref }}
          VC_BOOTSTRAP_EXPECTED_SEED_COMMIT: ${{ inputs.expected_seed_commit }}
          VC_BOOTSTRAP_EXPECTED_ENGINE: ${{ inputs.expected_engine }}
          VC_BOOTSTRAP_EXPECTED_REVISION: ${{ inputs.expected_revision }}
          VC_GITHUB_EVIDENCE_TOKEN: ${{ github.token }}
        run: node scripts/bootstrap-seed.mjs
      - name: Retain sanitized bootstrap outcome including failures
        if: always() && steps.mode.outputs.mode == 'bootstrap-only' && hashFiles('bootstrap-seed-outcome.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: bootstrap-seed-outcome.json
          if-no-files-found: error
          retention-days: 30
      - name: Observe bundled seed without publication
        if: steps.mode.outputs.mode == 'observe-only'
        env:
          VC_OBSERVATION_MODE: ${{ inputs.mode }}
          VC_OBSERVATION_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          VC_OBSERVATION_EXPECTED_REF: ${{ inputs.expected_ref }}
          VC_OBSERVATION_EXPECTED_SEED_COMMIT: ${{ inputs.expected_seed_commit }}
          VC_OBSERVATION_EXPECTED_ENGINE: ${{ inputs.expected_engine }}
          VC_OBSERVATION_EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: node scripts/observe-seed.mjs
      - name: Retain sanitized seed observation, including failures
        if: always() && steps.mode.outputs.mode == 'observe-only' && hashFiles('seed-observation-outcome.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: seed-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: seed-observation-outcome.json
          if-no-files-found: error
          retention-days: 30
      - name: Observe publisher head without publication
        if: steps.mode.outputs.mode == 'head-only'
        env:
          VC_OBSERVATION_MODE: ${{ inputs.mode }}
          VC_OBSERVATION_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          VC_OBSERVATION_EXPECTED_REF: ${{ inputs.expected_ref }}
          VC_OBSERVATION_EXPECTED_SEED_COMMIT: ${{ inputs.expected_seed_commit }}
          VC_OBSERVATION_EXPECTED_ENGINE: ${{ inputs.expected_engine }}
          VC_OBSERVATION_EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: node scripts/observe-head.mjs
      - name: Retain sanitized head observation, including failures
        if: always() && steps.mode.outputs.mode == 'head-only' && hashFiles('head-observation-outcome.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: head-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: head-observation-outcome.json
          if-no-files-found: error
          retention-days: 30
      - name: Select the validated candidate without broadening OIDC scope
        if: steps.mode.outputs.mode == 'publish'
        id: candidate
        run: node scripts/select-publication.cjs
      - name: Publish exact main commit with GitHub OIDC
        if: steps.mode.outputs.mode == 'publish' && steps.candidate.outputs.publish == 'true'
        env:
          VC_GITHUB_EVIDENCE_TOKEN: ${{ github.token }}
        # The service independently verifies main ancestry, completed validation CI,
        # all required steps and exact committed artifacts before writing anything.
        run: node scripts/publish-content.mjs --commit "${{ steps.candidate.outputs.commit }}"
      - name: Retain truthful publisher outcome
        if: always() && hashFiles('publication-outcome.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: publisher-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-outcome.json
          if-no-files-found: error
          retention-days: 30
