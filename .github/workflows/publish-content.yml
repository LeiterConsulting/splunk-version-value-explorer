name: Publish verified content
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'qualify-exports-only' && 'Qualify original export evidence (no publisher request)' || github.event_name == 'workflow_dispatch' && inputs.mode == 'commissioning-only' && 'Observe authenticated publisher identity (no database)' || github.event_name == 'workflow_dispatch' && inputs.mode == 'recover-seed-only' && 'Prepare bounded seed batches (D1 writes, no head)' || github.event_name == 'workflow_dispatch' && inputs.mode == 'observe-only' && 'Observe bundled seed' || github.event_name == 'workflow_dispatch' && inputs.mode == 'head-only' && 'Observe publisher head' || github.event_name == 'workflow_dispatch' && inputs.mode == 'bootstrap-only' && 'Bootstrap reviewed seed (D1 write)' || github.event_name == 'workflow_dispatch' && inputs.mode == 'resume-only' && 'Prepare bundled seed batch (D1 write)' || github.event_name == 'workflow_dispatch' && inputs.mode == 'stage-only' && 'Stage candidate batch (D1 write)' || github.event_name == 'workflow_dispatch' && inputs.mode == 'current-head-only' && 'Observe current publisher head' || 'Publish verified content' }}
on:
  workflow_run:
    workflows: [Validate release metadata and reports]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Publish held; observations are read-only; bootstrap-only writes reviewed seed/history to D1 without activation; resume-only writes one seed batch without head/history; stage-only writes one candidate batch/provenance without head/history
        type: choice
        options: [publish, qualify-exports-only, commissioning-only, recover-seed-only, observe-only, head-only, bootstrap-only, resume-only, stage-only, current-head-only]
        default: publish
        required: true
      validation_run:
        description: Qualification-only exact successful main validation run ID, attempt 1
        type: string
      recovery_initial_present:
        description: Recovery-only exact independently observed starting row count; changed count stops before writing
        type: string
        default: '50'
      recovery_max_batches:
        description: Recovery-only authorized maximum sequential calls (1-20); never bootstrap; attempt 1 only
        type: string
        default: '19'
      expected_commit:
        description: Observation, bootstrap and resume modes require the exact main commit SHA
        type: string
      expected_ref:
        description: Observation, bootstrap and resume modes must use refs/heads/main
        type: string
        default: refs/heads/main
      expected_engine:
        description: Observation, bootstrap and resume modes require the engine revision from the reviewed deployed-seed record
        type: string
      expected_revision:
        description: Observation, bootstrap and resume modes require the bundled revision from the reviewed deployed-seed record
        type: string
      expected_seed_commit:
        description: Observation, bootstrap and resume modes require the reviewed deployed seed GitHub source commit
        type: string
      expected_candidate_revision:
        description: Stage-only exact reviewed candidate revision (engine must match deployed runtime)
        type: string
      expected_head_revision:
        description: Current-head-only exact expected pointer revision (reader state is observed, not changed)
        type: string
permissions:
  actions: read
  contents: read
  id-token: write
concurrency:
  group: versioncompass-content-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: (github.event_name == 'workflow_dispatch' && inputs.mode != 'qualify-exports-only') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      # This policy executes from the workflow itself, before any repository script.
      # A delayed validation of an older commit cannot check out an older writer.
      - name: Hold publication before checkout or credentials
        if: github.event_name != 'workflow_dispatch' || (inputs.mode != 'commissioning-only' && inputs.mode != 'recover-seed-only' && inputs.mode != 'observe-only' && inputs.mode != 'head-only' && inputs.mode != 'bootstrap-only' && inputs.mode != 'resume-only' && inputs.mode != 'stage-only' && inputs.mode != 'current-head-only')
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const receipt = { commit: /^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA || '') ? process.env.GITHUB_SHA : null,
            recordedAt: new Date().toISOString(), status: 'held-publication-disabled', action: 'pre-write-hold', target: 'local-policy',
            completedActions: [], requests: 0, credentialAcquired: false, mutationAttempted: false, mutationOutcome: 'not-attempted', claimedDelivered: false,
            qualification: 'Publication held before checkout, candidate selection, credentials and production requests. Runtime and publisher state remain unobserved.' };
          fs.writeFileSync('publication-outcome.json', JSON.stringify(receipt, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\nPublisher outcome: **held-publication-disabled**\n\n' + receipt.qualification + '\n');
          console.log(JSON.stringify(receipt));
          process.exitCode = 1;
          NODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Route publisher mode before any candidate selection
        id: mode
        run: node scripts/publisher-workflow-mode.cjs
      - name: Observe authenticated publisher identity without database access
        if: steps.mode.outputs.mode == 'commissioning-only'
        timeout-minutes: 2
        env:
          VC_COMMISSION_MODE: ${{ inputs.mode }}
          VC_COMMISSION_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          VC_COMMISSION_EXPECTED_REF: ${{ inputs.expected_ref }}
          VC_COMMISSION_EXPECTED_ENGINE: ${{ inputs.expected_engine }}
          VC_COMMISSION_EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: node scripts/commission-publisher.mjs
      - name: Retain sanitized commissioning observation including failures
        if: always() && steps.mode.outputs.mode == 'commissioning-only' && hashFiles('publisher-commissioning-outcome.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: publisher-commissioning-${{ github.run_id }}-${{ github.run_attempt }}
          path: publisher-commissioning-outcome.json
          if-no-files-found: error
          retention-days: 30
      - name: Prepare bounded seed batches with independent count readback
        if: steps.mode.outputs.mode == 'recover-seed-only'
        timeout-minutes: 17
        env:
          VC_RECOVERY_MODE: ${{ inputs.mode }}
          VC_RECOVERY_INITIAL_PRESENT: ${{ inputs.recovery_initial_present }}
          VC_RECOVERY_MAX_BATCHES: ${{ inputs.recovery_max_batches }}
          VC_RESUME_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          VC_RESUME_EXPECTED_REF: ${{ inputs.expected_ref }}
          VC_RESUME_EXPECTED_SEED_COMMIT: ${{ inputs.expected_seed_commit }}
          VC_RESUME_EXPECTED_ENGINE: ${{ inputs.expected_engine }}
          VC_RESUME_EXPECTED_REVISION: ${{ inputs.expected_revision }}
          VC_GITHUB_EVIDENCE_TOKEN: ${{ github.token }}
        run: node scripts/recover-seed.mjs
      - name: Retain immutable bounded recovery receipts including failures
        if: always() && steps.mode.outputs.mode == 'recover-seed-only'
        uses: actions/upload-artifact@v4
        with:
          name: seed-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vc-seed-recovery/
          if-no-files-found: error
          retention-days: 30
      - name: Stage one exact candidate batch without publication
        if: steps.mode.outputs.mode == 'stage-only'
        env:
          VC_STAGE_MODE: ${{ inputs.mode }}
          VC_STAGE_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          VC_STAGE_EXPECTED_REF: ${{ inputs.expected_ref }}
          VC_STAGE_EXPECTED_SEED_COMMIT: ${{ inputs.expected_seed_commit }}
          VC_STAGE_EXPECTED_ENGINE: ${{ inputs.expected_engine }}
          VC_STAGE_EXPECTED_REVISION: ${{ inputs.expected_revision }}
          VC_STAGE_EXPECTED_CANDIDATE_REVISION: ${{ inputs.expected_candidate_revision }}
          VC_GITHUB_EVIDENCE_TOKEN: ${{ github.token }}
        run: node scripts/stage-candidate.mjs
      - name: Retain sanitized candidate staging outcome including failures
        if: always() && steps.mode.outputs.mode == 'stage-only' && hashFiles('stage-candidate-outcome.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: stage-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: stage-candidate-outcome.json
          if-no-files-found: error
          retention-days: 30
      - name: Prepare one exact bundled seed batch without publication
        if: steps.mode.outputs.mode == 'resume-only'
        env:
          VC_RESUME_MODE: ${{ inputs.mode }}
          VC_RESUME_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          VC_RESUME_EXPECTED_REF: ${{ inputs.expected_ref }}
          VC_RESUME_EXPECTED_SEED_COMMIT: ${{ inputs.expected_seed_commit }}
          VC_RESUME_EXPECTED_ENGINE: ${{ inputs.expected_engine }}
          VC_RESUME_EXPECTED_REVISION: ${{ inputs.expected_revision }}
          VC_GITHUB_EVIDENCE_TOKEN: ${{ github.token }}
        run: node scripts/resume-seed.mjs
      - name: Retain sanitized seed preparation outcome including failures
        if: always() && steps.mode.outputs.mode == 'resume-only' && hashFiles('resume-seed-outcome.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: resume-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: resume-seed-outcome.json
          if-no-files-found: error
          retention-days: 30
      - name: Bootstrap exact reviewed seed without activation
        if: steps.mode.outputs.mode == 'bootstrap-only'
        env:
          VC_BOOTSTRAP_MODE: ${{ inputs.mode }}
          VC_BOOTSTRAP_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          VC_BOOTSTRAP_EXPECTED_REF: ${{ inputs.expected_ref }}
          VC_BOOTSTRAP_EXPECTED_SEED_COMMIT: ${{ inputs.expected_seed_commit }}
          VC_BOOTSTRAP_EXPECTED_ENGINE: ${{ inputs.expected_engine }}
          VC_BOOTSTRAP_EXPECTED_REVISION: ${{ inputs.expected_revision }}
          VC_GITHUB_EVIDENCE_TOKEN: ${{ github.token }}
        run: node scripts/bootstrap-seed.mjs
      - name: Retain sanitized bootstrap outcome including failures
        if: always() && steps.mode.outputs.mode == 'bootstrap-only' && hashFiles('bootstrap-seed-outcome.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: bootstrap-seed-outcome.json
          if-no-files-found: error
          retention-days: 30
      - name: Observe bundled seed without publication
        if: steps.mode.outputs.mode == 'observe-only'
        env:
          VC_OBSERVATION_MODE: ${{ inputs.mode }}
          VC_OBSERVATION_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          VC_OBSERVATION_EXPECTED_REF: ${{ inputs.expected_ref }}
          VC_OBSERVATION_EXPECTED_SEED_COMMIT: ${{ inputs.expected_seed_commit }}
          VC_OBSERVATION_EXPECTED_ENGINE: ${{ inputs.expected_engine }}
          VC_OBSERVATION_EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: node scripts/observe-seed.mjs
      - name: Retain sanitized seed observation, including failures
        if: always() && steps.mode.outputs.mode == 'observe-only' && hashFiles('seed-observation-outcome.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: seed-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: seed-observation-outcome.json
          if-no-files-found: error
          retention-days: 30
      - name: Observe exact current head without publication
        if: steps.mode.outputs.mode == 'current-head-only'
        env:
          VC_OBSERVATION_MODE: ${{ inputs.mode }}
          VC_OBSERVATION_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          VC_OBSERVATION_EXPECTED_REF: ${{ inputs.expected_ref }}
          VC_OBSERVATION_EXPECTED_SEED_COMMIT: ${{ inputs.expected_seed_commit }}
          VC_OBSERVATION_EXPECTED_ENGINE: ${{ inputs.expected_engine }}
          VC_OBSERVATION_EXPECTED_HEAD_REVISION: ${{ inputs.expected_head_revision }}
          VC_OBSERVATION_EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: node scripts/observe-current-head.mjs
      - name: Retain sanitized head observation, including failures
        if: always() && steps.mode.outputs.mode == 'current-head-only' && hashFiles('current-head-observation-outcome.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: current-head-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: current-head-observation-outcome.json
          if-no-files-found: error
          retention-days: 30
      - name: Observe publisher head without publication
        if: steps.mode.outputs.mode == 'head-only'
        env:
          VC_OBSERVATION_MODE: ${{ inputs.mode }}
          VC_OBSERVATION_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          VC_OBSERVATION_EXPECTED_REF: ${{ inputs.expected_ref }}
          VC_OBSERVATION_EXPECTED_SEED_COMMIT: ${{ inputs.expected_seed_commit }}
          VC_OBSERVATION_EXPECTED_ENGINE: ${{ inputs.expected_engine }}
          VC_OBSERVATION_EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: node scripts/observe-head.mjs
      - name: Retain sanitized head observation, including failures
        if: always() && steps.mode.outputs.mode == 'head-only' && hashFiles('head-observation-outcome.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: head-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: head-observation-outcome.json
          if-no-files-found: error
          retention-days: 30
      - name: Select the validated candidate without broadening OIDC scope
        if: steps.mode.outputs.mode == 'publish'
        id: candidate
        run: node scripts/select-publication.cjs
      - name: Publish exact main commit with GitHub OIDC
        if: steps.mode.outputs.mode == 'publish' && steps.candidate.outputs.publish == 'true'
        env:
          VC_GITHUB_EVIDENCE_TOKEN: ${{ github.token }}
        # The service independently verifies main ancestry, completed validation CI,
        # all required steps and exact committed artifacts before writing anything.
        run: node scripts/publish-content.mjs --commit "${{ steps.candidate.outputs.commit }}"
      - name: Retain truthful publisher outcome
        if: always() && hashFiles('publication-outcome.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: publisher-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-outcome.json
          if-no-files-found: error
          retention-days: 30

  qualify-exports:
    # Read-only commissioning of the existing producer. Not an admission request.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'qualify-exports-only' &&
      github.repository == 'LeiterConsulting/splunk-version-value-explorer' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Bind manual qualification inputs before acquisition
        env:
          VC_QUALIFICATION_MODE: ${{ inputs.mode }}
          VC_QUALIFICATION_COMMIT: ${{ inputs.expected_commit }}
          VC_QUALIFICATION_REF: ${{ inputs.expected_ref }}
          VC_VALIDATION_RUN: ${{ inputs.validation_run }}
        run: node scripts/export-qualification-workflow.cjs
      - name: Install exact reviewed offline verifier
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/vc-pinned-verifier"
          mkdir "$destination"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 \
            https://github.com/cli/cli/releases/download/v2.104.0/gh_2.104.0_linux_amd64.tar.gz \
            --output "$destination/gh.tar.gz"
          echo "98cb101ad87dbbd3f6b2f2bfcbd43197ccd07643140121d8a9cfaa91eadbc24e  $destination/gh.tar.gz" | sha256sum --check --strict
          tar -xzf "$destination/gh.tar.gz" -C "$destination" gh_2.104.0_linux_amd64/bin/gh
          echo "fca7ac8a8386e3ad65c9a96a96cbf272d1dcc4f76de174dae91d54e50729e240  $destination/gh_2.104.0_linux_amd64/bin/gh" | sha256sum --check --strict
      - name: Install locked Worker build dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build exact checkout before report input comparison
        run: node scripts/build-worker.cjs
      - name: Qualify original signed exports against fresh exact-main service evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VC_VALIDATION_RUN: ${{ inputs.validation_run }}
        run: >-
          python3 scripts/qualify_admission_exports.py
          --validation-run "$VC_VALIDATION_RUN"
          --gh "$RUNNER_TEMP/vc-pinned-verifier/gh_2.104.0_linux_amd64/bin/gh"
          --node "$(command -v node)"
          --output "$RUNNER_TEMP/vc-export-qualification"
      - name: Retain fixed original-export qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-${{ github.run_id }}-1
          path: ${{ runner.temp }}/vc-export-qualification/qualification.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain original acquisition audit including partial failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vc-export-qualification/*.json
            ${{ runner.temp }}/vc-export-qualification/*.zip
          if-no-files-found: ignore
          retention-days: 30
